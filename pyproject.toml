[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyorderbooks-backtest"
version = "0.1.0"
description = "Replay-accurate backtesting for Polymarket order-book history via PolyOrderbooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "PolyOrderbooks", email = "contact@polyorderbooks.com" }]
keywords = ["polymarket", "backtest", "order-book", "prediction-markets", "trading"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "polyorderbooks>=0.2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
polyorderbooks-backtest = "polyorderbooks_backtest.cli:main"

[project.urls]
Homepage = "https://polyorderbooks.com"
Documentation = "https://docs.polyorderbooks.com"
Repository = "https://github.com/polyorderbookslabs/polyorderbooks-backtest-python"
Issues = "https://github.com/polyorderbookslabs/polyorderbooks-backtest-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polyorderbooks_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]